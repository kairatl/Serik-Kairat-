<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Greenpath</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🌿 Check Your Eco Impact</h1>

<form id="calculatorForm">
    <label for="userName">User Name:</label>
    <input type="text" id="userName" placeholder="Enter your name">

    <label for="distance">Distance (km):</label>
    <input type="number" id="distance" placeholder="Enter distance">

    <label for="transport">Transport Mode:</label>
    <select id="transport">
        <option value="petrol">Gasoline Car</option>
        <option value="electric">Electric Car</option>
        <option value="bus">Public Bus</option>
    </select>

    <button type="button" onclick="calculateEmissions()">Calculate</button>
</form>

<div id="output">
    <!-- Results will be displayed here -->
</div>

<script src="script.js"></script>
</body>
</html>
